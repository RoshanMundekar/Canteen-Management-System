{% load static %}<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Modern Canteen{% endblock %} | Modern College of Arts, Science &amp; Commerce</title>
  <meta name="description" content="Official canteen services portal of Modern College of Arts, Science and Commerce, Shivajinagar, Pune.">
  <link rel="icon" href="{% static 'canteenapp/images/moderncollege.jpg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}bg-slate-50{% endblock %} font-sans text-slate-800 antialiased min-h-screen flex flex-col">
  {% block body %}{% endblock %}

  <script>
    // Mobile navigation toggles: any [data-toggle="#id"] button shows/hides its target.
    document.querySelectorAll('[data-toggle]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var target = document.querySelector(btn.getAttribute('data-toggle'));
        if (!target) return;
        target.classList.toggle('hidden');
        btn.setAttribute('aria-expanded', target.classList.contains('hidden') ? 'false' : 'true');
      });
    });
    // Dismissible flash messages.
    document.querySelectorAll('[data-dismiss]').forEach(function (btn) {
      btn.addEventListener('click', function () { btn.closest('[data-alert]').remove(); });
    });
    document.querySelectorAll('[data-year]').forEach(function (el) { el.textContent = new Date().getFullYear(); });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
