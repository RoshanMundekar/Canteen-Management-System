{% comment %}Admin dish card + edit modal. Params: name, price, about, img, cat, uid (unique prefix per section){% endcomment %}
{% with mid="edit-"|add:uid|add:"-"|add:name|slugify %}
<article class="card flex flex-col overflow-hidden">
  <div class="aspect-[16/10] bg-slate-100"><img src="/media/{{ img }}" alt="{{ name }}" loading="lazy" class="h-full w-full object-cover" onerror="this.style.visibility='hidden'"></div>
  <div class="flex flex-1 flex-col p-4">
    <div class="flex items-start justify-between gap-3">
      <h4 class="font-semibold capitalize text-navy-900">{{ name }}</h4>
      <span class="shrink-0 font-bold text-navy-800">&#8377;{{ price }}</span>
    </div>
    <p class="mt-1 line-clamp-2 text-sm text-slate-500">{{ about }}</p>
    <button type="button" onclick="openModal('{{ mid }}')" class="btn-outline mt-auto w-full !py-2">{% include "partials/icon.html" with name="edit" cls="h-4 w-4" %}Edit dish</button>
  </div>
</article>

<div id="{{ mid }}" data-modal class="fixed inset-0 z-[60] hidden items-end justify-center bg-navy-950/60 p-0 backdrop-blur-sm sm:items-center sm:p-4" role="dialog" aria-modal="true" aria-labelledby="{{ mid }}-title">
  <div class="max-h-[92vh] w-full overflow-y-auto rounded-t-xl bg-white shadow-2xl sm:max-w-lg sm:rounded-xl">
    <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
      <h3 id="{{ mid }}-title" class="font-serif text-lg font-bold text-navy-900">Edit <span class="capitalize">{{ name }}</span></h3>
      <button type="button" onclick="closeModal('{{ mid }}')" class="rounded-md p-1.5 text-slate-500 hover:bg-slate-100" aria-label="Close">{% include "partials/icon.html" with name="x" %}</button>
    </div>
    <form action="/admenu2" method="post" enctype="multipart/form-data" class="space-y-5 p-5">
      {% csrf_token %}
      <input type="hidden" name="dishname" value="{{ name }}">
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label class="field-label">Dish name</label><input type="text" name="dishname2" value="{{ name }}" required class="field"></div>
        <div><label class="field-label">Price (&#8377;)</label><input type="text" name="dishprice2" value="{{ price }}" required class="field"></div>
      </div>
      <div><label class="field-label">Description</label><input type="text" name="aboutdish2" value="{{ about }}" required class="field"></div>
      <div class="grid gap-5 sm:grid-cols-2">
        <div><label class="field-label">New photo</label><input type="file" name="dishimg2" required accept="image/*" class="field !py-2 text-xs file:mr-2 file:rounded file:border-0 file:bg-navy-50 file:px-2 file:py-1 file:text-xs file:font-medium file:text-navy-700"></div>
        <div><label class="field-label">Category</label><input type="text" name="dishcategory2" value="{{ cat }}" required readonly class="field bg-slate-50 text-slate-500"></div>
      </div>
      <div class="flex flex-col-reverse gap-3 border-t border-slate-100 pt-5 sm:flex-row sm:justify-end">
        <button type="button" onclick="closeModal('{{ mid }}')" class="btn-outline">Cancel</button>
        <button type="submit" class="btn-primary">Save changes</button>
      </div>
    </form>
  </div>
</div>
{% endwith %}
